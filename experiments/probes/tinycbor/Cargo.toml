[package]
name = "probe-tinycbor"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "probe"

[[bin]]
name = "probe-tinycbor"
path = "src/main.rs"
test = false
bench = false

[dependencies]
embedded-io = { version = "=0.7.1", default-features = false }
tinycbor = { version = "=0.13.0", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
