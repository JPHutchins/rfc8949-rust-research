[package]
name = "probe-minicbor"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "probe"

[[bin]]
name = "probe-minicbor"
path = "src/main.rs"
test = false
bench = false

[dependencies]
minicbor = { version = "=2.3.1", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
