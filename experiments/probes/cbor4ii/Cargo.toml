[package]
name = "probe-cbor4ii"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "probe"

[[bin]]
name = "probe-cbor4ii"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cbor4ii = { version = "=1.2.4", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
